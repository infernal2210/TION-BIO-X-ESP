[platformio]
default_envs = tion_biox_lite

[env]
platform = espressif8266@4.2.1
board = esp01_1m
board_build.ldscript = eagle.flash.1m64.ld
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8.0
build_flags =
    -D MQTT_MAX_PACKET_SIZE=768

[env:tion_biox_lite]
build_flags =
    ${env.build_flags}
    -D TION_PROFILE_LITE=1

[env:tion_biox_full]
build_flags =
    ${env.build_flags}
    -D TION_PROFILE_FULL=1

[env:tion_biox_lite_ota]
extends = env:tion_biox_lite
upload_protocol = espota
upload_flags = --auth=${sysenv.OTA_PASSWORD}
