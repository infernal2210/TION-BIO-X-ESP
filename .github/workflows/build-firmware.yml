name: Build MQTT firmware

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release tag (for example v1.0.0). Leave empty to build without publishing."
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build MQTT Lite
        working-directory: mqtt
        run: pio run -e tion_biox_lite
      - name: Build MQTT Full
        working-directory: mqtt
        run: pio run -e tion_biox_full
      - name: Collect binaries
        run: |
          mkdir -p dist
          cp mqtt/.pio/build/tion_biox_lite/firmware.bin dist/tion-biox-mqtt-lite.bin
          cp mqtt/.pio/build/tion_biox_full/firmware.bin dist/tion-biox-mqtt-full.bin
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: tion-biox-mqtt-firmware
          path: dist/*.bin
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_version }}
          target_commitish: ${{ github.sha }}
          name: TION BIO X ESP ${{ inputs.release_version }}
          generate_release_notes: true
          files: |
            dist/tion-biox-mqtt-lite.bin
            dist/tion-biox-mqtt-full.bin
